services:
  db:
    image: postgres:16-alpine
    container_name: certready-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: certready
      POSTGRES_PASSWORD: certready
      POSTGRES_DB: certready
    ports:
      - "5433:5432"
    volumes:
      - certready-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certready -d certready"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  certready-pgdata:
